{% extends "base.html" %}
{% block title %}Bad Request (400) | NIDARS{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="command-panel p-5 shadow-lg">
                <div class="display-1 text-warning fw-bold mb-3">400</div>
                <h2 class="h3 text-white fw-bold mb-3">Invalid Request Format</h2>
                <p class="text-muted mb-4">
                    The submitted request parameters or payload did not match the expected schema required by NIDARS.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-custom">Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
